[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    --strict-config
    -ra
filterwarnings =
    error::DeprecationWarning:jarvis.config
    default
markers =
    slow: tests that take more than a second
