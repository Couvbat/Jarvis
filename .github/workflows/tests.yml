name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # requirements-test.txt deliberately omits sounddevice, webrtcvad,
        # faster-whisper and ollama: the suite stubs them, so CI needs no
        # PortAudio, no C toolchain and no model downloads.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Install Jarvis itself, without its dependencies
        # So the suite imports the installed package rather than the source
        # tree - which is what a user gets, and what src/ layout is for.
        run: pip install -e . --no-deps

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  package:
    # A wheel that is missing a subpackage still passes the tests above,
    # because those can fall back to the source tree. This job cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel and check what it contains
        run: |
          pip install dist/*.whl --no-deps
          python -c "import jarvis; print(jarvis.__version__)"
          python -c "import jarvis.tools.mcp.manager, jarvis.policy.engine, jarvis.speech.pipeline"
          test -x "$(command -v jarvis)"
          test -x "$(command -v jarvis-setup-piper)"
