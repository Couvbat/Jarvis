[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.4.0"
description = "A local voice assistant with tool calling, filesystem CRUD and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jules Hémery" }]
keywords = ["voice-assistant", "whisper", "ollama", "piper", "mcp", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Upper bounds are on the major version only. They are there because these
# four have broken us before or would: the ollama client changed its response
# type in 0.4, and the MCP SDK's session API is not stable across majors.
dependencies = [
    # Audio
    "sounddevice>=0.4.6,<1",
    "soundfile>=0.12.1,<1",
    "numpy>=1.24,<3",
    "webrtcvad>=2.0.10,<3",
    # Speech to text
    "faster-whisper>=0.10,<2",
    # LLM. >=0.4 returns pydantic response models rather than dicts; the
    # conversation history normalises them, but older clients are untested.
    "ollama>=0.4,<1",
    # MCP client
    "mcp>=2.2,<3",
    # Web and system
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "psutil>=5.9,<8",
    # Configuration and output
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "loguru>=0.7,<1",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
# Hands-free activation. Optional because it pulls in onnxruntime and
# tflite-runtime, whose wheels are not available everywhere, and because
# typing at Jarvis is a legitimate way to use it.
wakeword = ["openwakeword>=0.6,<1"]
# Everything the suite needs and nothing native: the stubs in tests/_stubs.py
# stand in for sounddevice, webrtcvad, faster-whisper and ollama, so CI needs
# no PortAudio, no C toolchain and no model downloads.
test = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<8",
    "pytest-mock>=3.12,<4",
    "pytest-asyncio>=0.24,<2",
    "responses>=0.25,<1",
]
dev = ["jarvis-assistant[test]", "ruff>=0.6,<1", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/Couvbat/Jarvis"
Issues = "https://github.com/Couvbat/Jarvis/issues"

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-setup-piper = "jarvis.setup_piper:main"
jarvis-index = "jarvis.rag.indexer:main"
jarvis-mcp = "jarvis.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
