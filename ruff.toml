line-length = 100
target-version = "py310"

[lint]
# Error-level rules only, so the gate is meaningful on the code as it stands
# today.  The wider style set (I, UP, W, and F401 on the application modules)
# is enabled in the cleanup step of the implementation plan - `ruff check .`
# with the default set currently reports ~430 style findings, almost all
# trailing whitespace on blank lines.
select = ["E9", "F63", "F7", "F82", "B"]
ignore = [
    "B904",  # exception chaining in tts_module - part of the cleanup step
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
