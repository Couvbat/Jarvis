line-length = 100
target-version = "py310"

[lint]
# The full gate: errors, undefined names, whitespace, import order, and the
# modernisation rules the 3.10 floor makes available. `B` catches the things
# that read as bugs rather than style - a mutable default, an exception raised
# inside an except block without chaining.
select = ["E", "F", "W", "I", "UP", "B"]

[lint.per-file-ignores]
# Tests assert on comparisons deliberately.
"tests/*" = ["B011"]

# `ruff format` is deliberately not part of the gate. Running it reformats 54
# files and 2500 lines, and its output is harder to read than what it replaces:
# the alias tables in text_utils.py become one entry per line, and the scripted
# tool-call literals in the tests become deeply nested. The linter is where the
# defects were (a duplicate dict key, two unchained exceptions, a dead
# assignment); the formatter would only have moved them around.
